<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contexto – KI-gestützte Textanalyse-Plattform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
    
    <style>
        /* --- DESIGN-SYSTEM & VARIABLEN (DARK MODE STANDARD) --- */
        :root {
            --bg: #0b0b0f;
            --bg2: #121218;
            --bg3: #1c1c24;
            --text: #f3f4f6;
            --text2: #9ca3af;
            --text3: #6b7280;
            --border: #22222e;
            --brand: #6366f1;       /* Dein lila Branding */
            --brand-hover: #4f46e5;
            --brand-light: rgba(99, 102, 241, 0.15);
            --green: #10b981;
            --red: #ef4444;
            --r: 12px;
            --shadow: rgba(0, 0, 0, 0.3);
        }

        /* --- EXAKT GLEICHES DESIGN IN WEISS (LIGHT MODE) --- */
        body.light-theme {
            --bg: #f9fafb;          /* Heller Hintergrund */
            --bg2: #ffffff;         /* Weiße Container-Boxen */
            --bg3: #f3f4f6;         /* Hellgraue Inputs / Topbar */
            --text: #111827;        /* Dunkler Haupttext */
            --text2: #4b5563;       /* Dunkelgrauer Sekundärtext */
            --text3: #9ca3af;
            --border: #e5e7eb;      /* Helle Trennlinien */
            --brand: #6366f1;       /* Lila bleibt exakt identisch */
            --brand-hover: #4f46e5;
            --brand-light: rgba(99, 102, 241, 0.15);
            --shadow: rgba(0, 0, 0, 0.05);
        }

        /* Globale Basis-Stile */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'DM Sans', sans-serif; transition: background-color 0.3s, border-color 0.3s, color 0.3s; }
        body { background: var(--bg); color: var(--text); overflow-x: hidden; line-height: 1.5; }

        /* Navigation */
        nav { display: flex; align-items: center; justify-content: center; height: 70px; border-bottom: 1px solid var(--border); background: var(--bg2); position: sticky; top:0; z-index:100; box-shadow: 0 2px 10px var(--shadow); }
        .nav-container { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .nav-logo { font-family: 'DM Serif Display', serif; font-size: 24px; color: var(--text); text-decoration: none; font-weight: bold; }
        .nav-logo span { color: var(--brand); }
        .nav-links { display: flex; list-style: none; gap: 24px; }
        .nav-links a { color: var(--text2); text-decoration: none; font-size: 14px; font-weight: 500; }
        .nav-links a:hover { color: var(--brand); }

        .theme-btn { background: var(--bg3); color: var(--text); border: 1px solid var(--border); padding: 8px 14px; border-radius: 8px; font-size: 13px; cursor: pointer; outline: none; font-weight: 500; }
        .theme-btn:hover { border-color: var(--brand); }

        /* Hero */
        .hero { position: relative; padding: 80px 20px 40px 20px; text-align: center; max-width: 800px; margin: 0 auto; }
        .hero-glow { position: absolute; width: 300px; height: 300px; background: rgba(99,102,241,0.1); filter: blur(80px); top: 20px; left: 50%; transform: translateX(-50%); z-index: -1; }
        .hero-eyebrow { font-size: 13px; color: var(--text2); margin-bottom: 16px; display: inline-flex; align-items: center; gap: 6px; background: var(--bg2); padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border); box-shadow: 0 2px 5px var(--shadow); }
        .eyebrow-dot { width: 6px; height: 6px; background: var(--green); border-radius: 50%; }
        .hero h1 { font-family: 'DM Serif Display', serif; font-size: 48px; line-height: 1.1; margin-bottom: 20px; color: var(--text); }
        .highlight-word { color: var(--brand); font-style: normal; }
        .hero-sub { color: var(--text2); font-size: 16px; max-width: 600px; margin: 0 auto 20px auto; }

        /* Tool Card */
        .tool-section { padding: 20px 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .tool-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; box-shadow: 0 20px 40px var(--shadow); }
        .tool-topbar { background: var(--bg3); padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; }
        .tb-dots { display: flex; gap: 6px; margin-right: 12px; }
        .tb-dot { width: 10px; height: 10px; border-radius: 50%; }
        .tb-dot.r { background: #ff5f56; } .tb-dot.y { background: #ffbd2e; } .tb-dot.g { background: #27c93f; }
        .tb-title { font-size: 12px; color: var(--text2); font-family: monospace; }

        .tool-body { padding: 24px; }

        /* Inputs */
        .input-wrap { position: relative; margin-bottom: 16px; }
        textarea.main { width: 100%; height: 160px; background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 16px; color: var(--text); font-size: 15px; resize: none; outline: none; }
        textarea.main:focus { border-color: var(--brand); }
        .char-badge { position: absolute; bottom: 12px; right: 12px; font-size: 11px; color: var(--text2); background: var(--bg2); padding: 2px 8px; border-radius: 4px; border: 1px solid var(--border); }

        /* Module Buttons */
        .label-sm { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--text2); margin-bottom: 10px; font-weight: bold; }
        .modes-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 24px; }
        .mode-btn { background: var(--bg3); color: var(--text2); border: 1px solid var(--border); padding: 10px 16px; border-radius: 20px; font-size: 13px; cursor: pointer; font-weight: 500; }
        .mode-btn:hover { color: var(--text); border-color: var(--text2); }
        .mode-btn.active { background: var(--brand-light); color: var(--brand); border-color: var(--brand); }

        /* Action Buttons */
        .run-row { display: flex; gap: 12px; margin-bottom: 16px; }
        .run-btn { background: var(--brand); color: #fff; border: none; padding: 12px 28px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; flex: 1; box-shadow: 0 4px 10px var(--brand-light); }
        .run-btn:hover { background: var(--brand-hover); }
        .clear-btn { background: transparent; color: var(--text2); border: 1px solid var(--border); padding: 12px 20px; border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: 500; }
        .clear-btn:hover { color: var(--text); background: var(--bg3); }

        .ki-warning-badge { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #b45309; background: rgba(217,119,6,0.1); border: 1px solid rgba(217,119,6,0.2); padding: 10px; border-radius: 6px; margin-bottom: 24px; }

        /* Result Box */
        .result-wrap { background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 20px; display: none; box-shadow: inset 0 2px 4px var(--shadow); }
        .result-wrap.show { display: block; }
        .result-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
        .result-header h3 { font-family: 'DM Serif Display', serif; font-size: 20px; color: var(--text); }
        .copy-btn { background: var(--bg2); color: var(--text2); border: 1px solid var(--border); padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; }
        .result-text { font-size: 15px; color: var(--text); line-height: 1.6; white-space: pre-line; }

        .spinner { width: 24px; height: 24px; border: 3px solid var(--border); border-top-color: var(--brand); border-radius: 50%; animation: spin 0.6s linear infinite; margin: 20px auto; display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<nav>
    <div class="nav-container">
        <a href="#" class="nav-logo">Context<span>o</span></a>
        <div class="nav-right">
            <button id="themeToggle" class="theme-btn">🌙 <span>Dark Mode</span></button>
        </div>
    </div>
</nav>

<section class="hero">
    <div class="hero-glow"></div>
    <p class="hero-eyebrow"><span class="eyebrow-dot"></span> Powered by Netlify Functions</p>
    <h1>Texte intelligent <em class="highlight-word">verstehen</em> und bearbeiten</h1>
    <p class="hero-sub">Contexto filtert Kernpunkte, korrigiert Grammatik und optimiert deine Texte per Knopfdruck.</p>
</section>

<section class="tool-section" id="tool">
    <div class="container">
        <div class="tool-card">
            <div class="tool-topbar">
                <div class="tb-dots"><div class="tb-dot r"></div><div class="tb-dot y"></div><div class="tb-dot g"></div></div>
                <span class="tb-title">contexto_secure_backend.js</span>
            </div>

            <div class="tool-body">
                <div class="input-wrap">
                    <textarea class="main" id="inputText" placeholder="Füge hier deinen Text ein..."></textarea>
                    <span class="char-badge" id="charCount">0 Zeichen</span>
                </div>

                <div class="label-sm">ANALYSE-MODUL WÄHLEN:</div>
                <div class="modes-row" id="modes">
                    <button class="mode-btn active" data-mode="summary">📄 Zusammenfassung</button>
                    <button class="mode-btn" data-mode="explain">💡 Einfach Erklären</button>
                    <button class="mode-btn" data-mode="rephrase_pro">💼 Profi-Stil umschreiben</button>
                    <button class="mode-btn" data-mode="grammar">✏️ Grammatik-Check</button>
                </div>

                <div class="run-row">
                    <button class="run-btn" id="runBtn" onclick="analyze()">Analyse ausführen</button>
                    <button class="clear-btn" id="clearBtn">Zurücksetzen</button>
                </div>

                <div class="spinner" id="loadingSpinner"></div>

                <div class="result-wrap" id="resultWrap">
                    <div class="result-header">
                        <h3 id="resultTitle">Ergebnis</h3>
                        <button class="copy-btn" id="copyBtn">📋 Kopieren</button>
                    </div>
                    <div id="resultBody" class="result-text"></div>
                </div>
            </div>
        </div>
    </div>
</section>

<script>
    // --- STEUERUNG FÜR DEN WEISSMODUS ---
    const toggleBtn = document.getElementById('themeToggle');
    toggleBtn.addEventListener('click', () => {
        document.body.classList.toggle('light-theme');
        const isLight = document.body.classList.contains('light-theme');
        toggleBtn.querySelector('span').textContent = isLight ? 'Light Mode' : 'Dark Mode';
        toggleBtn.firstChild.textContent = isLight ? '☀️ ' : '🌙 ';
    });

    // Zeichenzähler
    const textarea = document.getElementById('inputText');
    textarea.addEventListener('input', () => {
        document.getElementById('charCount').textContent = `${textarea.value.length} Zeichen`;
    });

    // Modul-Auswahl-Buttons
    let currentMode = 'summary';
    const modeButtons = document.querySelectorAll('.mode-btn');
    modeButtons.forEach(btn => {
        btn.addEventListener('click', () => {
            modeButtons.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentMode = btn.getAttribute('data-mode');
        });
    });

    // Zurücksetzen Button
    document.getElementById('clearBtn').addEventListener('click', () => {
        textarea.value = '';
        document.getElementById('charCount').textContent = '0 Zeichen';
        document.getElementById('resultWrap').classList.remove('show');
    });

    // --- DIE KORREKTE LIVE-ANALYSE FUNKTION ---
    async function analyze() {
        const textInput = textarea.value.trim();
        if (!textInput) {
            alert('Bitte gib zuerst einen Text ein!');
            return;
        }

        const spinner = document.getElementById('loadingSpinner');
        const resultWrap = document.getElementById('resultWrap');
        const resultBody = document.getElementById('resultBody');

        resultWrap.classList.remove('show');
        spinner.style.display = 'block';

        try {
            // Ruft deine Netlify Function auf (Pfad passt sich automatisch an deine neue Domain an)
            const response = await fetch('/.netlify/functions/contexto_secure_backend', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: textInput, mode: currentMode })
            });

            const data = await response.json();
            spinner.style.display = 'none';

            if (response.ok && data.result) {
                resultWrap.classList.add('show');
                resultBody.textContent = data.result;
            } else {
                throw new Error(data.error || 'Unbekannter Serverfehler');
            }

        } catch (error) {
            spinner.style.display = 'none';
            alert('Fehler bei der Analyse: ' + error.message);
        }
    }

    // Kopieren Button
    document.getElementById('copyBtn').addEventListener('click', () => {
        navigator.clipboard.writeText(document.getElementById('resultBody').textContent);
        alert('Ergebnis kopiert!');
    });
</script>
</body>
</html>
